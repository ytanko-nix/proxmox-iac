# =============================================================================
# Terraform Validation Workflow
# =============================================================================
# Этот workflow запускается на каждый Pull Request и выполняет:
# - Проверку форматирования (terraform fmt)
# - Инициализацию без backend (для валидации синтаксиса)
# - Валидацию конфигурации (terraform validate)
# - Статический анализ кода (tflint)
# - Сканирование безопасности (tfsec)
#
# Секреты НЕ требуются для validate workflow (используется -backend=false)
# =============================================================================

name: Terraform Validate

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      # Запускать только при изменениях в Terraform файлах
      - 'terraform/**'
      - '.github/workflows/terraform_validate.yml'

  # Позволяет запустить workflow вручную
  workflow_dispatch:

# Отменить предыдущие запуски при новом push в тот же PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Переменные окружения
# =============================================================================
env:
  # Версия Terraform (1.7.x - последняя стабильная в линейке)
  TF_VERSION: "1.7.5"
  
  # Версия tflint
  TFLINT_VERSION: "v0.50.3"
  
  # Версия tfsec
  TFSEC_VERSION: "v1.28.5"
  
  # Рабочая директория с Terraform кодом
  TF_WORKING_DIR: terraform
  
  # Уровень логирования Terraform (TRACE, DEBUG, INFO, WARN, ERROR)
  TF_LOG: "INFO"
  
  # Путь для логов Terraform (опционально)
  # TF_LOG_PATH: "/tmp/terraform.log"
  
  # Отключить интерактивный ввод
  TF_INPUT: "false"
  
  # Использовать цветной вывод в CI
  TF_IN_AUTOMATION: "true"

jobs:
  # ===========================================================================
  # Job 1: Проверка форматирования
  # ===========================================================================
  format-check:
    name: 📐 Format Check
    runs-on: ubuntu-latest
    
    steps:
      # -----------------------------------------------------------------------
      # Шаг 1: Checkout репозитория
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Получить полную историю для корректной работы с PR
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Шаг 2: Установка Terraform
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Отключить wrapper для чистого вывода
          terraform_wrapper: false

      # -----------------------------------------------------------------------
      # Шаг 3: Кэширование Terraform плагинов
      # Ускоряет повторные запуски за счёт кэширования провайдеров
      # -----------------------------------------------------------------------
      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ env.TF_WORKING_DIR }}/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf', '**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      # -----------------------------------------------------------------------
      # Шаг 4: Проверка форматирования Terraform кода
      # -check: только проверка, без изменения файлов
      # -diff: показать различия
      # -recursive: проверить все поддиректории
      # -----------------------------------------------------------------------
      - name: Terraform Format Check
        id: fmt
        run: |
          echo "🔍 Проверка форматирования Terraform кода..."
          terraform fmt -check -diff -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Шаг 5: Комментарий в PR при ошибке форматирования
      # -----------------------------------------------------------------------
      - name: Comment on PR - Format Error
        if: steps.fmt.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 📐 Terraform Format Check ❌

            Код не соответствует стандартам форматирования Terraform.

            Выполните локально:
            \`\`\`bash
            cd terraform && terraform fmt -recursive
            \`\`\`

            Затем закоммитьте изменения.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # -----------------------------------------------------------------------
      # Шаг 6: Fail при ошибке форматирования
      # -----------------------------------------------------------------------
      - name: Fail on format error
        if: steps.fmt.outcome == 'failure'
        run: exit 1

  # ===========================================================================
  # Job 2: Валидация Terraform
  # ===========================================================================
  validate:
    name: ✅ Terraform Validate
    runs-on: ubuntu-latest
    needs: format-check
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # -----------------------------------------------------------------------
      # Кэширование для ускорения init
      # -----------------------------------------------------------------------
      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ env.TF_WORKING_DIR }}/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf', '**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      # -----------------------------------------------------------------------
      # Шаг: Инициализация Terraform без backend
      # -backend=false: не настраивать backend (не требует credentials)
      # -input=false: не запрашивать ввод
      # -----------------------------------------------------------------------
      - name: Terraform Init (without backend)
        id: init
        run: |
          echo "🚀 Инициализация Terraform (без backend)..."
          terraform init -backend=false -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -----------------------------------------------------------------------
      # Шаг: Валидация конфигурации
      # Проверяет синтаксис и внутреннюю согласованность
      # -----------------------------------------------------------------------
      - name: Terraform Validate
        id: validate
        run: |
          echo "✅ Валидация Terraform конфигурации..."
          terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -----------------------------------------------------------------------
      # Шаг: Комментарий с результатами валидации в PR
      # -----------------------------------------------------------------------
      - name: Comment Validation Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### ✅ Terraform Validation Results

            | Check | Status |
            |-------|--------|
            | Init | ${{ steps.init.outcome == 'success' && '✅ Success' || '❌ Failed' }} |
            | Validate | ${{ steps.validate.outcome == 'success' && '✅ Success' || '❌ Failed' }} |

            *Pushed by: @${{ github.actor }}, Workflow: \`${{ github.workflow }}\`*`;

            // Найти существующий комментарий и обновить или создать новый
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Terraform Validation Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }

  # ===========================================================================
  # Job 3: TFLint - статический анализ
  # ===========================================================================
  tflint:
    name: 🔎 TFLint Analysis
    runs-on: ubuntu-latest
    needs: format-check
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Кэширование TFLint плагинов
      # Значительно ускоряет повторные запуски
      # -----------------------------------------------------------------------
      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ env.TFLINT_VERSION }}-${{ hashFiles('.tflint.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tflint-${{ env.TFLINT_VERSION }}-
            ${{ runner.os }}-tflint-

      # -----------------------------------------------------------------------
      # Установка TFLint
      # -----------------------------------------------------------------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      # -----------------------------------------------------------------------
      # Создание конфигурации TFLint если её нет
      # -----------------------------------------------------------------------
      - name: Create TFLint config if not exists
        run: |
          if [ ! -f "${{ env.TF_WORKING_DIR }}/.tflint.hcl" ]; then
            echo "📝 Создание базовой конфигурации TFLint..."
            cat > "${{ env.TF_WORKING_DIR }}/.tflint.hcl" << 'EOF'
          # TFLint Configuration
          # https://github.com/terraform-linters/tflint

          config {
            # Отключить module inspection (требует credentials)
            module = false
          }

          # Правила для Terraform
          plugin "terraform" {
            enabled = true
            preset  = "recommended"
          }
          EOF
          fi

      # -----------------------------------------------------------------------
      # Инициализация TFLint (загрузка плагинов)
      # -----------------------------------------------------------------------
      - name: Initialize TFLint
        run: |
          echo "🔧 Инициализация TFLint..."
          tflint --init
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -----------------------------------------------------------------------
      # Запуск TFLint
      # --format=compact: компактный вывод для CI
      # --recursive: проверить все поддиректории
      # -----------------------------------------------------------------------
      - name: Run TFLint
        id: tflint
        run: |
          echo "🔎 Запуск TFLint анализа..."
          tflint --format=compact --recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

  # ===========================================================================
  # Job 4: TFSec - сканирование безопасности
  # ===========================================================================
  tfsec:
    name: 🛡️ Security Scan (tfsec)
    runs-on: ubuntu-latest
    needs: format-check
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Запуск tfsec через официальный action
      # --soft-fail: не прерывать pipeline при warnings
      # -----------------------------------------------------------------------
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          # Формат вывода: default, json, csv, checkstyle, junit, sarif
          format: default
          # Мягкий режим - предупреждения не ломают build
          soft_fail: true
          # Дополнительные аргументы
          additional_args: --concise-output

      # -----------------------------------------------------------------------
      # Альтернативный запуск с детальным выводом
      # -----------------------------------------------------------------------
      - name: Run tfsec (detailed)
        run: |
          echo "🛡️ Сканирование безопасности с tfsec..."
          
          # Установка tfsec если не установлен
          if ! command -v tfsec &> /dev/null; then
            curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          fi
          
          # Запуск с детальным выводом
          tfsec ${{ env.TF_WORKING_DIR }} \
            --format=lovely \
            --out=tfsec-results.txt \
            --soft-fail || true
          
          # Показать результаты
          if [ -f tfsec-results.txt ]; then
            cat tfsec-results.txt
          fi
        continue-on-error: true

  # ===========================================================================
  # Job 5: Финальный статус
  # ===========================================================================
  validation-status:
    name: 📊 Validation Status
    runs-on: ubuntu-latest
    needs: [format-check, validate, tflint, tfsec]
    if: always()
    
    steps:
      - name: Check validation status
        run: |
          echo "📊 Проверка финального статуса валидации..."
          
          # Проверка статусов всех jobs
          if [ "${{ needs.format-check.result }}" != "success" ]; then
            echo "❌ Format check failed"
            exit 1
          fi
          
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "❌ Terraform validate failed"
            exit 1
          fi
          
          if [ "${{ needs.tflint.result }}" != "success" ]; then
            echo "❌ TFLint failed"
            exit 1
          fi
          
          # tfsec может иметь warnings, проверяем только critical failures
          if [ "${{ needs.tfsec.result }}" == "failure" ]; then
            echo "⚠️ TFSec found issues (soft fail)"
          fi
          
          echo "✅ Все проверки пройдены успешно!"

      # -----------------------------------------------------------------------
      # Финальный комментарий в PR
      # -----------------------------------------------------------------------
      - name: Final PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const formatStatus = '${{ needs.format-check.result }}' === 'success' ? '✅' : '❌';
            const validateStatus = '${{ needs.validate.result }}' === 'success' ? '✅' : '❌';
            const tflintStatus = '${{ needs.tflint.result }}' === 'success' ? '✅' : '❌';
            const tfsecStatus = '${{ needs.tfsec.result }}' === 'success' ? '✅' : '⚠️';

            const output = `## 📊 Terraform Validation Summary

            | Check | Status | Description |
            |-------|--------|-------------|
            | Format | ${formatStatus} | Code formatting (terraform fmt) |
            | Validate | ${validateStatus} | Configuration validation |
            | TFLint | ${tflintStatus} | Static code analysis |
            | TFSec | ${tfsecStatus} | Security scanning |

            ---
            *Commit: \`${{ github.sha }}\` | Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

